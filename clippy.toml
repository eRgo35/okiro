# okiro clippy configuration.
# Library code (`okiro-core`) MUST NOT panic on None/Err; tests and the
# binary crate MAY panic freely.

disallowed-methods = [
    { path = "std::option::Option::unwrap", reason = "library code must not panic; return Result instead" },
    { path = "std::option::Option::expect", reason = "library code must not panic; return Result instead" },
    { path = "std::result::Result::unwrap", reason = "library code must not panic; return Result instead" },
    { path = "std::result::Result::expect", reason = "library code must not panic; return Result instead" },
]

# Warn earlier than stock to keep public APIs tight.
cognitive-complexity-threshold = 9
type-complexity-threshold = 200